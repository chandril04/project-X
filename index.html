<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* Modern UI Overlay */
        #msg-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; background: rgba(0,0,0,0.8); color: white;
            border-radius: 30px; font-family: sans-serif; font-weight: bold;
            z-index: 10000; text-align: center; border: 2px solid #00ff00;
            display: none; /* Hidden by default */
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10001;
            display: flex; justify-content: center; align-items: center;
        }
        button {
            padding: 20px 40px; font-size: 18px; border-radius: 10px;
            background: #28a745; color: white; border: none; cursor: pointer;
        }
    </style>

    <script>
        // SHADER: Your working transparent video code
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'},
                threshold: {type: 'number', default: 0.6}
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform sampler2D tex; uniform vec3 keyColor; uniform float threshold; varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) discard;
                            else gl_FragColor = fColor;
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() { if (this.texture) this.texture.needsUpdate = true; }
        });

        let appState = "SCANNING"; // Possible: SCANNING, READY_TO_SPAWN

        AFRAME.registerComponent('logic-handler', {
            init: function() {
                const msgBox = document.querySelector('#msg-box');
                const video = document.querySelector('#gs-video');
                const floor = document.querySelector('#floor');

                // 1. STEP: SCAN SUCCESSFUL
                this.el.addEventListener('targetFound', () => {
                    if (appState === "SCANNING") {
                        appState = "READY_TO_SPAWN";
                        msgBox.innerHTML = "Cloning is done! <br> Now point at the surface and tap to spawn.";
                        msgBox.style.display = "block";
                        // Temporarily show video on target to show it's "captured"
                        document.querySelector('#target-plane').setAttribute('visible', 'true');
                        video.play();
                    }
                });

                // 2. STEP: SPAWN ON CLICK
                floor.addEventListener('click', (evt) => {
                    if (appState === "READY_TO_SPAWN") {
                        const newVideo = document.createElement('a-plane');
                        const hitPoint = evt.detail.intersection.point;
                        
                        newVideo.setAttribute('position', hitPoint);
                        newVideo.setAttribute('rotation', '0 0 0'); // Standing up
                        newVideo.setAttribute('material', 'shader: transparent-video; src: #gs-video; threshold: 0.6');
                        newVideo.setAttribute('width', '1');
                        newVideo.setAttribute('height', '1.77');
                        
                        this.el.sceneEl.appendChild(newVideo);
                        msgBox.innerHTML = "Spawned! Tap elsewhere to add more.";
                    }
                });
            }
        });

        function startApp() {
            document.querySelector('#start-screen').style.display = 'none';
            document.querySelector('#msg-box').style.display = 'block';
            document.querySelector('#msg-box').innerText = "Step 1: Scan the Photo";
            // Pre-warm video
            const v = document.querySelector('#gs-video');
            v.play(); v.pause();
        }
    </script>
</head>

<body>
    <div id="start-screen"><button onclick="startApp()">START AR</button></div>
    <div id="msg-box">Step 1: Scan the Photo</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        vr-mode-ui="enabled: false" 
        cursor="rayOrigin: mouse"
        raycaster="objects: .surface">

        <a-assets>
            <video id="gs-video" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="my-target" mindar-image-target="targetIndex: 0" logic-handler>
            <a-plane id="target-plane" visible="false" material="shader: transparent-video; src: #gs-video" height="1" width="1.77"></a-plane>
        </a-entity>

        <a-plane id="floor" class="surface" rotation="-90 0 0" position="0 -1.5 -3" width="20" height="20" material="opacity: 0; transparent: true"></a-plane>

    </a-scene>
</body>
</html>
