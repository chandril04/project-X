<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
        // 1. YOUR WORKING TRANSPARENT SHADER
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'},
                threshold: {type: 'number', default: 0.6}
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D tex;
                        uniform vec3 keyColor;
                        uniform float threshold;
                        varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) discard;
                            else gl_FragColor = fColor;
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() {
                if (this.texture) this.texture.needsUpdate = true;
            }
        });

        // 2. SURFACE SPANWER COMPONENT
        AFRAME.registerComponent('surface-spawner', {
            init: function() {
                const videoAsset = document.querySelector('#gs-video');
                
                this.el.addEventListener('click', (evt) => {
                    // Create a new entity for the spawned video
                    const newVideo = document.createElement('a-plane');
                    
                    // Get the exact 3D point where the user clicked the "floor"
                    const touchPoint = evt.detail.intersection.point;
                    
                    newVideo.setAttribute('position', touchPoint);
                    // Rotation 0 0 0 makes it "stand up" like a person
                    newVideo.setAttribute('rotation', '0 0 0'); 
                    newVideo.setAttribute('material', {
                        shader: 'transparent-video',
                        src: '#gs-video',
                        threshold: 0.6
                    });
                    newVideo.setAttribute('width', '1');
                    newVideo.setAttribute('height', '1.77');
                    
                    this.el.sceneEl.appendChild(newVideo);
                    videoAsset.play();
                    console.log("Spawned at:", touchPoint);
                });
            }
        });

        // IMAGE TARGET CONTROLLER
        AFRAME.registerComponent('ar-controller', {
            init: function() {
                const video = document.querySelector('#gs-video');
                this.el.addEventListener('targetFound', () => {
                    video.play();
                });
                this.el.addEventListener('targetLost', () => video.pause());
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="ui" style="position:fixed; z-index:9999; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center;">
        <button onclick="document.querySelector('#ui').style.display='none'; document.querySelector('#gs-video').play(); document.querySelector('#gs-video').pause();" 
                style="padding: 20px; font-size: 20px; border-radius: 10px; cursor: pointer;">
            TAP TO START AR
        </button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable-surface">

        <a-assets>
            <video id="gs-video" src="video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" ar-controller>
            <a-plane 
                material="shader: transparent-video; src: #gs-video; threshold: 0.6; color: #00ff00" 
                position="0 0 0" 
                height="1" 
                width="1.77"> 
            </a-plane>
        </a-entity>

        <a-plane 
            class="clickable-surface" 
            surface-spawner 
            rotation="-90 0 0" 
            position="0 -1.5 -2" 
            width="10" 
            height="10" 
            material="opacity: 0.0; transparent: true">
        </a-plane>

    </a-scene>
</body>
</html>
