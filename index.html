<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        #msg-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px; background: rgba(0,0,0,0.8); color: #00ff00;
            border-radius: 15px; font-family: sans-serif; z-index: 10000;
            text-align: center; display: none; width: 80%;
        }
        #ui-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 20px; background: #28a745; color: white; border-radius: 10px;
            z-index: 10001; border: none; font-weight: bold;
        }
    </style>

    <script>
        // SHADER: Transparent Video
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'},
                threshold: {type: 'number', default: 0.6}
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform sampler2D tex; uniform vec3 keyColor; uniform float threshold; varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) discard;
                            else gl_FragColor = fColor;
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() { if (this.texture) this.texture.needsUpdate = true; }
        });

        let isCloned = false;

        AFRAME.registerComponent('logic-controller', {
            init: function() {
                const msg = document.querySelector('#msg-box');
                const video = document.querySelector('#gs-video');
                
                // When Photo is Scanned
                this.el.addEventListener('targetFound', () => {
                    if(!isCloned) {
                        isCloned = true;
                        msg.style.display = "block";
                        msg.innerHTML = "CLONING DONE! <br> Point at the ground and TAP to place.";
                        video.play();
                    }
                });

                // When Floor is Tapped
                this.el.sceneEl.addEventListener('click', (evt) => {
                    if(isCloned) {
                        // Create clone
                        const clone = document.createElement('a-plane');
                        const pos = evt.detail.intersection.point;
                        
                        clone.setAttribute('position', pos);
                        clone.setAttribute('rotation', '0 0 0'); // Stand upright
                        clone.setAttribute('material', 'shader: transparent-video; src: #gs-video; threshold: 0.6');
                        clone.setAttribute('width', '1');
                        clone.setAttribute('height', '1.77');
                        
                        this.el.sceneEl.appendChild(clone);
                        msg.innerText = "Spawned successfully!";
                    }
                });
            }
        });
    </script>
</head>

<body>
    <button id="ui-btn" onclick="this.style.display='none'; document.querySelector('#gs-video').play();">START AR</button>
    <div id="msg-box">Scan the Photo First...</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        vr-mode-ui="enabled: false" 
        cursor="rayOrigin: mouse"
        raycaster="objects: .surface-check">

        <a-assets>
            <video id="gs-video" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" logic-controller>
            <a-plane material="shader: transparent-video; src: #gs-video" height="1" width="1.77"></a-plane>
        </a-entity>

        <a-plane class="surface-check" 
                 rotation="-90 0 0" 
                 position="0 -1.5 -5" 
                 width="100" height="100" 
                 material="opacity: 0.0; transparent: true">
        </a-plane>

    </a-scene>
</body>
</html>
