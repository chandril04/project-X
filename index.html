<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
        AFRAME.registerShader('transparent-video', {
            schema: {
                src: {type: 'map'},
                color: {type: 'color', default: '#00ff00'}, // Targeted green
                threshold: {type: 'number', default: 0.1}  // How much green to kill
            },
            init: function(data) {
                this.texture = new THREE.VideoTexture(data.src);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        tex: {value: this.texture},
                        keyColor: {value: new THREE.Color(data.color)},
                        threshold: {value: data.threshold}
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D tex;
                        uniform vec3 keyColor;
                        uniform float threshold;
                        varying vec2 vUv;
                        void main() {
                            vec4 fColor = texture2D(tex, vUv);
                            // Calculate how close the pixel is to the target green
                            float diff = distance(fColor.rgb, keyColor);
                            if (diff < threshold) {
                                discard; // Make it transparent
                            } else {
                                gl_FragColor = fColor;
                            }
                        }
                    `,
                    transparent: true
                });
            },
            tick: function() {
                // FORCE THE VIDEO TO UPDATE EACH FRAME
                if (this.texture) this.texture.needsUpdate = true;
            }
        });

        // This component handles the actual "Play" command when the target is found
        AFRAME.registerComponent('ar-controller', {
            init: function() {
                const video = document.querySelector('#gs-video');
                this.el.addEventListener('targetFound', () => {
                    video.muted = false; // Try to play with sound
                    video.play().catch(e => {
                        console.log("Autoplay blocked, playing muted");
                        video.muted = true;
                        video.play();
                    });
                });
                this.el.addEventListener('targetLost', () => video.pause());
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="ui" style="position:fixed; z-index:9999; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center;">
        <button onclick="document.querySelector('#ui').style.display='none'; document.querySelector('#gs-video').play(); document.querySelector('#gs-video').pause();" 
                style="padding: 20px; font-size: 20px; border-radius: 10px; cursor: pointer;">
            TAP TO START AR
        </button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <video id="gs-video" src="video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" ar-controller>
            <a-plane 
                material="shader: transparent-video; src: #gs-video; threshold: 0.6; color: #00ff00" 
                position="0 0 0" 
                height="1" 
                width="1.77"> </a-plane>
        </a-entity>
    </a-scene>
</body>
</html>
