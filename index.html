<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); z-index: 999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: white; font-family: sans-serif;
      }
      button {
        padding: 15px 30px; font-size: 18px; cursor: pointer;
        background: #007bff; color: white; border: none; border-radius: 5px;
      }
    </style>

    <script>
      // The Transparent Shader
      AFRAME.registerShader('chromakey', {
        schema: {
          src: {type: 'map'},
          color: {default: {r: 0.1, g: 0.9, b: 0.2}},
          threshold: {default: 0.3}
        },
        init: function(data) {
          this.material = new THREE.ShaderMaterial({
            uniforms: {
              tex: {value: new THREE.VideoTexture(data.src)},
              color: {value: new THREE.Color(data.color)},
              threshold: {value: data.threshold}
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              varying vec2 vUv;
              uniform sampler2D tex;
              uniform vec3 color;
              uniform float threshold;
              void main() {
                vec4 texColor = texture2D(tex, vUv);
                float diff = distance(texColor.rgb, color);
                if (diff < threshold) discard;
                else gl_FragColor = texColor;
              }
            `,
            transparent: true
          });
        }
      });

      // UI Logic
      window.onload = () => {
        const startBtn = document.querySelector("#startBtn");
        const overlay = document.querySelector("#overlay");
        const video = document.querySelector("#gs-video");

        startBtn.addEventListener('click', () => {
          overlay.style.display = "none";
          // Attempt to play/pause video to unlock audio context
          video.play().then(() => {
            video.pause();
          });
        });
      };
    </script>
  </head>

  <body>
    <div id="overlay">
      <h2>MindAR Project</h2>
      <p>Ensure your .mind file and .mp4 are in the same folder!</p>
      <button id="startBtn">Start AR Camera</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="gs-video" src="video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane 
          material="shader: chromakey; src: #gs-video; threshold: 0.3" 
          position="0 0 0" 
          height="1" 
          width="1">
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#gs-video');
      const target = document.querySelector('[mindar-image-target]');
      
      target.addEventListener("targetFound", () => video.play());
      target.addEventListener("targetLost", () => video.pause());
    </script>
  </body>
</html>
